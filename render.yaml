services:
  - type: web
    name: polymarket-ai-agent
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polymarket-ai-agent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_API_SECRET
        sync: false
      - key: POLYMARKET_API_PASSPHRASE
        sync: false
      - key: POLYMARKET_ADDRESS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  # A single research/resolution cycle is short-lived, so Cron is more
  # cost-efficient than a continuously running worker for this project.
  - type: cron
    name: polymarket-ai-agent-worker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker_once.py
    schedule: "*/15 * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polymarket-ai-agent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_API_SECRET
        sync: false
      - key: POLYMARKET_API_PASSPHRASE
        sync: false
      - key: POLYMARKET_ADDRESS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: polymarket-ai-agent-db
    plan: free
