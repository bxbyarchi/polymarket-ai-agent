services:
  - type: web
    name: polymarket-ai-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polymarket-ai-agent-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: worker
    name: polymarket-ai-agent-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polymarket-ai-agent-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: polymarket-ai-agent-db
    plan: free
