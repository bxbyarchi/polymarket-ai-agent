services:
  - type: web
    name: polymarket-ai-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polymarket-ai-agent-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

  # Render does not offer a Free plan for continuous background workers.
  # Keep the worker on the smallest paid worker plan so the 15-minute
  # research/resolution loop remains a real long-running process.
  - type: worker
    name: polymarket-ai-agent-worker
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polymarket-ai-agent-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: polymarket-ai-agent-db
    plan: free
